name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix-finance-issues-cuban-app-14107363946182207192

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Decodificar keystore desde el secreto
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Compilar APK de Release firmado
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-firmado
          path: app/build/outputs/apk/release/app-release.apk

      - name: Borrar keystore del runner (limpieza)
        if: always()
        run: rm -f my-upload-key.jks
